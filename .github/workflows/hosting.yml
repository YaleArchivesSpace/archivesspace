name: Build image and notify on new tagged version

on:
  push:
    tags:
      - 'v*-yale-*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to send in the test notification"
        required: false
        default: "v0.0.0-test"

jobs:
  build-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-yale-(prod|test|qa|dev)-[0-9]{8}$ ]]; then
            echo "Tag '$TAG' does not match vX.X.X-yale-{prod|test|qa|dev}-MMDDYYYY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: meta
        run: |
          REF="${{ github.ref_name }}"
          TAG="${REF#v}"
          TAG="${TAG#V}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_REPOSITORY }}:${{ steps.meta.outputs.tag }}

  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        if: github.event_name == 'push'
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-yale-(prod|test|qa|dev)-[0-9]{8}$ ]]; then
            echo "Tag '$TAG' does not match vX.X.X-yale-{prod|test|qa|dev}-MMDDYYYY"
            exit 1
          fi

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "$(jq -n \
              --arg version "$VERSION" \
              --arg repo "$REPO" \
              --arg ref "$REF" \
              --arg sha "$SHA" \
              --arg run_url "$RUN_URL" \
              '{
                text: "New version tag published: \($version)\nRepo: \($repo)\nRef: \($ref)\nCommit: \($sha)\nWorkflow run: \($run_url)"
              }')"
