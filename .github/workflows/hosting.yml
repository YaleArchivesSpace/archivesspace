name: Build image and notify on new tagged version or branch

on:
  push:
    branches:
      - "v*-yale-*"
    tags:
      - "v*-yale-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to send in the test notification"
        required: false
        default: "v0.0.0-test"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Validate tag format
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-yale-(prod|test|qa|dev)-[0-9]{8}$ ]]; then
            echo "Ref '$TAG' does not match vX.X.X-yale-{prod|test|qa|dev}-MMDDYYYY"
            exit 1
          fi

      - name: Compute image tag
        id: meta
        run: |
          REF="${{ github.ref_name }}"
          TAG="${REF#v}"
          TAG="${TAG#V}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

  build-docker:
    if: github.event_name == 'push'
    needs: validate
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
          TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          docker build --platform linux/${{ matrix.arch }} -t $REPOSITORY:$TAG-${{ matrix.arch }} .
          docker push $REPOSITORY:$TAG-${{ matrix.arch }}

  push-manifest:
    if: github.event_name == 'push'
    needs:
      - validate
      - build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push multi-arch manifest to Docker Hub
        env:
          REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
          TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          docker buildx imagetools create -t $REPOSITORY:$TAG \
            $REPOSITORY:$TAG-amd64 \
            $REPOSITORY:$TAG-arm64

  notify:
    runs-on: ubuntu-latest
    needs: push-manifest
    if: always() && (github.event_name == 'workflow_dispatch' || needs.push-manifest.result == 'success')
    steps:
      - name: Validate tag format
        if: github.event_name == 'push'
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-yale-(prod|test|qa|dev)-[0-9]{8}$ ]]; then
            echo "Ref '$TAG' does not match vX.X.X-yale-{prod|test|qa|dev}-MMDDYYYY"
            exit 1
          fi

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "$(jq -n \
              --arg version "$VERSION" \
              --arg repo "$REPO" \
              --arg ref "$REF" \
              --arg sha "$SHA" \
              --arg run_url "$RUN_URL" \
              '{
                text: ":merged: New version published: \($version)\nRepo: \($repo)\nRef: \($ref)\nCommit: \($sha)\nWorkflow run: \($run_url)"
              }')"
